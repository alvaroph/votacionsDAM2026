server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy del WebSocket cap al servei backend del docker compose
    location /ws {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Fitxers amb hash al nom: es poden cachejar molt de temps
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualsevol ruta desconeguda torna index.html (Vue Router amb createWebHistory)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
